<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Vitals & Search Visibility Analyzer</title>
<style>
  :root {
    --bg: #0a0c12;
    --bg-elevated: #12151f;
    --panel: #161a26;
    --panel-hover: #1b202f;
    --border: #262c3d;
    --border-soft: #1d2231;
    --text: #eef0f6;
    --text-dim: #9198ad;
    --text-faint: #5c6379;
    --seo: #2dd4a7;
    --seo-glow: rgba(45, 212, 167, 0.15);
    --aeo: #f5a742;
    --aeo-glow: rgba(245, 167, 66, 0.15);
    --geo: #a78bfa;
    --geo-glow: rgba(167, 139, 250, 0.15);
    --pass: #34d399;
    --fail: #f87171;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(91,140,255,0.10), transparent),
      radial-gradient(ellipse 700px 400px at 90% 10%, rgba(167,139,250,0.08), transparent),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header { padding: 56px 24px 28px; text-align: center; }
  .eyebrow {
    display: inline-flex; gap: 8px; align-items: center;
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 14px;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  header h1 {
    margin: 0 0 10px; font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 700; letter-spacing: -0.02em;
  }
  header p { margin: 0; color: var(--text-dim); font-size: 0.98rem; }
  .badge-row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .pill {
    font-size: 0.78rem; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    border: 1px solid; letter-spacing: 0.02em;
  }
  .pill.seo { color: var(--seo); border-color: var(--seo); background: var(--seo-glow); }
  .pill.aeo { color: var(--aeo); border-color: var(--aeo); background: var(--aeo-glow); }
  .pill.geo { color: var(--geo); border-color: var(--geo); background: var(--geo-glow); }

  /* ---------- Search bar ---------- */
  .search-wrap { max-width: 640px; margin: 0 auto 8px; padding: 0 24px; }
  .search-bar {
    display: flex; gap: 8px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px;
    transition: border-color 0.2s;
  }
  .search-bar:focus-within { border-color: var(--accent); }
  .search-bar input {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: none; background: transparent;
    color: var(--text); font-size: 1rem; outline: none;
  }
  .search-bar input::placeholder { color: var(--text-faint); }
  .search-bar button {
    padding: 12px 24px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), #7b9dff);
    color: white; font-weight: 600; cursor: pointer; font-size: 0.95rem;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .search-bar button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,140,255,0.35); }
  .search-bar button:active:not(:disabled) { transform: translateY(0); }
  .search-bar button:disabled { opacity: 0.5; cursor: default; }

  .examples { display: flex; gap: 8px; justify-content: center; margin: 12px 0 40px; flex-wrap: wrap; }
  .examples button {
    background: transparent; border: 1px solid var(--border-soft); color: var(--text-faint);
    font-size: 0.78rem; padding: 5px 12px; border-radius: 999px; cursor: pointer; transition: all 0.15s;
  }
  .examples button:hover { border-color: var(--accent); color: var(--text); }

  main { max-width: 920px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- Status / loading ---------- */
  .status { text-align: center; color: var(--text-dim); padding: 60px 20px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status .sub { font-size: 0.85rem; color: var(--text-faint); margin-top: 6px; }

  .error {
    text-align: center; color: var(--fail); padding: 24px; background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.3); border-radius: 14px; font-size: 0.92rem;
  }

  /* ---------- Overall score ---------- */
  .overall {
    display: flex; align-items: center; gap: 28px; padding: 28px;
    background: linear-gradient(135deg, var(--panel), var(--bg-elevated));
    border: 1px solid var(--border); border-radius: 20px; margin-bottom: 24px;
    animation: rise 0.4s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .overall .ring-wrap { flex-shrink: 0; position: relative; width: 108px; height: 108px; }
  .overall .ring-wrap svg { transform: rotate(-90deg); }
  .overall .ring-label {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .overall .ring-label .num { font-size: 1.7rem; font-weight: 800; line-height: 1; }
  .overall .ring-label .grade { font-size: 0.75rem; color: var(--text-faint); margin-top: 2px; letter-spacing: 0.05em; }
  .overall .meta-block { min-width: 0; }
  .overall .meta-block .url { font-weight: 600; font-size: 1.05rem; word-break: break-all; }
  .overall .meta-block .sub { color: var(--text-dim); font-size: 0.85rem; margin-top: 6px; }
  .overall .meta-block .sub b { color: var(--text); }

  /* ---------- Category cards ---------- */
  .categories { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 28px; }
  @media (max-width: 720px) { .categories { grid-template-columns: 1fr; } }
  .cat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    position: relative; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.15s;
    animation: rise 0.4s ease-out backwards;
  }
  .cat-card:nth-child(1) { animation-delay: 0.05s; }
  .cat-card:nth-child(2) { animation-delay: 0.1s; }
  .cat-card:nth-child(3) { animation-delay: 0.15s; }
  .cat-card:hover { transform: translateY(-2px); }
  .cat-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .cat-card[data-cat="SEO"]::before { background: var(--seo); }
  .cat-card[data-cat="AEO"]::before { background: var(--aeo); }
  .cat-card[data-cat="GEO"]::before { background: var(--geo); }
  .cat-card[data-cat="SEO"]:hover { border-color: var(--seo); }
  .cat-card[data-cat="AEO"]:hover { border-color: var(--aeo); }
  .cat-card[data-cat="GEO"]:hover { border-color: var(--geo); }
  .cat-card .cat-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .cat-card h3 { margin: 0; font-size: 0.72rem; letter-spacing: 0.12em; color: var(--text-faint); text-transform: uppercase; font-weight: 700; }
  .cat-card .cat-score { font-size: 2rem; font-weight: 800; line-height: 1; }
  .cat-card .cat-grade {
    font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 8px;
    display: inline-block; vertical-align: middle;
  }
  .cat-card .cat-summary { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; }
  .cat-card .bar { height: 5px; border-radius: 3px; background: var(--border-soft); margin-top: 14px; overflow: hidden; }
  .cat-card .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease-out; }
  .cat-card[data-cat="SEO"] .bar-fill { background: var(--seo); }
  .cat-card[data-cat="AEO"] .bar-fill { background: var(--aeo); }
  .cat-card[data-cat="GEO"] .bar-fill { background: var(--geo); }
  .cat-card .expand-hint { font-size: 0.7rem; color: var(--text-faint); margin-top: 12px; display: flex; align-items: center; gap: 4px; }

  /* ---------- Findings ---------- */
  .findings {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    margin-bottom: 16px; overflow: hidden; animation: rise 0.4s ease-out backwards;
  }
  .findings-header {
    display: flex; align-items: center; gap: 10px; padding: 16px 20px;
    border-bottom: 1px solid var(--border-soft); cursor: pointer; user-select: none;
  }
  .findings-header .dot { width: 8px; height: 8px; border-radius: 50%; }
  .findings[data-cat="SEO"] .dot { background: var(--seo); }
  .findings[data-cat="AEO"] .dot { background: var(--aeo); }
  .findings[data-cat="GEO"] .dot { background: var(--geo); }
  .findings-header h3 { margin: 0; font-size: 0.95rem; flex: 1; }
  .findings-header .chev { color: var(--text-faint); font-size: 0.8rem; transition: transform 0.2s; }
  .findings-header .count { font-size: 0.75rem; color: var(--text-faint); }
  .findings-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .findings-body.open { max-height: 3000px; }
  .finding { display: flex; gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--border-soft); }
  .finding:last-child { border-bottom: none; }
  .finding .mark {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 0.7rem; font-weight: 800; margin-top: 1px;
  }
  .finding.pass .mark { color: var(--pass); background: rgba(52,211,153,0.12); }
  .finding.fail .mark { color: var(--fail); background: rgba(248,113,113,0.12); }
  .finding .check { font-weight: 600; font-size: 0.9rem; }
  .finding .detail { color: var(--text-dim); font-size: 0.82rem; margin-top: 3px; line-height: 1.45; }
  .finding .fix {
    color: var(--accent); font-size: 0.82rem; margin-top: 6px; padding: 8px 10px;
    background: rgba(91,140,255,0.08); border-radius: 8px; line-height: 1.4;
  }

  /* ---------- Actions ---------- */
  .actions {
    background: linear-gradient(135deg, rgba(91,140,255,0.08), rgba(167,139,250,0.05));
    border: 1px solid rgba(91,140,255,0.3); border-radius: 16px; padding: 22px 24px;
    animation: rise 0.4s ease-out backwards; animation-delay: 0.2s;
  }
  .actions h3 { margin: 0 0 14px; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
  .actions ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .actions li { display: flex; gap: 12px; font-size: 0.88rem; line-height: 1.5; }
  .actions li .num {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    color: white; font-size: 0.72rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow"><span class="dot"></span>AI-Powered Visibility Report</div>
  <h1>Web Vitals & Search Visibility Analyzer</h1>
  <p>See exactly how a page performs across classic search, answer engines, and generative AI.</p>
  <div class="badge-row">
    <span class="pill seo">SEO · Search</span>
    <span class="pill aeo">AEO · Answer Engines</span>
    <span class="pill geo">GEO · Generative AI</span>
  </div>
</header>

<div class="search-wrap">
  <div class="search-bar">
    <input id="url-input" type="text" placeholder="https://example.com" />
    <button id="analyze-btn">Analyze</button>
  </div>
</div>
<div class="examples">
  <button data-url="https://en.wikipedia.org/wiki/Search_engine_optimization">wikipedia.org</button>
  <button data-url="https://stripe.com">stripe.com</button>
  <button data-url="https://example.com">example.com</button>
</div>

<main id="results"></main>

<script src="/static/app.js"></script>
</body>
</html>
